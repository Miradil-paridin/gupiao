# =============================================================================
# 市场数据配置
# =============================================================================
market_data:
  start_date: "2020-01-01"
  end_date: null
  adjust: hfq
  overwrite: false

# =============================================================================
# 数据源配置
# =============================================================================
providers:
  daily:
    - baostock
    - akshare
    - sina
  fallback_enabled: true

# =============================================================================
# 策略配置 V3.1（优化后）
# =============================================================================
strategy:
  # 选股参数（采用优化结果）
  top_k: 15                          # 优化后：15只
  invest_more_n: 15
  least_n: 3

  # 入场过滤（采用优化结果）
  use_tradeability_filter: true
  use_limit_up_pullback: true
  pullback_window_start: 3
  pullback_window_end: 10
  pullback_min_pct: 0.10             # 优化后：10%（原5%太宽松）
  pullback_max_pct: 0.30             # 优化后：30%（原25%）

  # 通达信指标
  use_tdx_indicators: true
  tdx_high30_weight: 1.0
  tdx_main_force_weight: 1.5
  tdx_limit_up_30d_weight: 0.5
  tdx_min_score: 1.5

  # 仓位管理
  use_volatility_sizing: true
  max_single_weight: 0.15
  max_total_position: 0.80

  # 市场环境
  use_market_regime: true

  # ========== 新增：行业分散控制 ==========
  industry_diversification:
    enabled: true
    max_per_industry: 2              # 单行业最多2只

  # ========== 新增：市值过滤 ==========
  market_cap_filter:
    enabled: true
    min_float_mkt_cap: 8.0e9         # 最小80亿流通市值
    max_float_mkt_cap: 8.0e11        # 最大8000亿

  # ========== 新增：流动性过滤 ==========
  liquidity_filter:
    enabled: true
    min_amount_20d: 6.0e7            # 20日均成交额>6000万
    min_turnover_20d: 0.6            # 20日均换手率>0.6%

  # ========== 新增：相关性控制 ==========
  correlation_control:
    enabled: true
    corr_lookback_days: 60
    max_pairwise_corr: 0.75          # 相关性>0.75不同时入选

  # ========== 新增：入场条件强化 ==========
  entry_mode: "strict"               # strict/normal/loose
  # strict: 必须满足(涨停回调 OR TDX高分) AND 趋势向上
  # normal: 满足任一即可（当前逻辑）
  # loose:  只要趋势向上即可

# =============================================================================
# 风控配置（采用优化结果）
# =============================================================================
risk_control:
  use_stop_loss: true
  stop_loss_pct: 0.06                # 优化后：6%（原8%太宽松）

  use_trailing_stop: true
  trailing_stop_pct: 0.08            # 优化后：8%（原10%太宽松）

  use_time_stop: true
  max_hold_days: 15

  use_ma_stop: true
  ma_stop_days: 2

  # ========== 新增：TDX保护 ==========
  use_tdx_protection: true           # 主力控盘股票可放宽止损
  tdx_protection_threshold: 2.0      # TDX分>2时，止损放宽到8%

# =============================================================================
# 新闻配置
# =============================================================================
news:
  sources:
    - eastmoney
    - cls
    - sina
    - ths
  max_per_source: 20
  include_in_ai: true

# =============================================================================
# AI配置
# =============================================================================
ai:
  include_news: true
  include_signals: true
  include_features: true

# =============================================================================
# 回测配置
# =============================================================================
backtest:
  initial_capital: 100000
  cost_bps: 15.0
  min_history_days: 60
  start_date: "2020-01-01"